<div style="display: flex; flex-direction: column;">
  <dc-import name="Nav" active="faq" hint-size="100%,76px"></dc-import>

  <div style="background: #0D0C0B; padding: clamp(56px,8vw,88px) clamp(20px,5vw,48px) clamp(40px,6vw,60px); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
    <div style="font-family: 'Outfit'; font-weight: 700; font-size: 14px; letter-spacing: 3px; color: #F0A125;">AYUDA</div>
    <h1 style="font-family: 'Outfit'; font-weight: 800; font-size: clamp(32px,5vw,48px); color: #FAF9F5; margin: 0;">Preguntas frecuentes</h1>
  </div>

  <div style="background: #FAF9F5; padding: 0 clamp(20px,5vw,48px) clamp(64px,8vw,90px); display: flex; justify-content: center;">
    <div style="max-width: 820px; width: 100%; margin-top: -30px; display: flex; flex-direction: column; gap: 34px;">

      <div>
        <div style="font-family: 'Outfit'; font-weight: 800; font-size: 15px; letter-spacing: 2px; color: #C9821D; margin-bottom: 14px;">GENERAL</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <dc-import name="FaqItem" q="¿Qué es ENSAMBLA?" a="La app donde tu grupo musical se organiza: canciones con acordes, listas y repertorios, eventos, ensayos, asignación de músicos e instrumentos, disponibilidad, recursos, chat interno y metrónomo." hint-size="100%,70px"></dc-import>
          <dc-import name="FaqItem" q="¿En qué plataformas está disponible?" a="iOS (App Store), Android (Google Play) y versión web. Tu cuenta y tus grupos se sincronizan entre todas." hint-size="100%,70px"></dc-import>
          <dc-import name="FaqItem" q="¿ENSAMBLA es gratis?" a="Tienes 14 días de prueba gratis, sin tarjeta. Después, cada organización contrata un plan desde Básico ($4.99/mes) hasta Professional ($34.99/mes con 5 organizaciones), según cuántas canciones, playlists, miembros y almacenamiento necesite." hint-size="100%,70px"></dc-import>
          <dc-import name="FaqItem" q="¿Qué pasa si no contrato al terminar la prueba?" a="Al vencer los 14 días necesitas un plan pago para seguir usando la organización; si no contratas, tus datos podrán eliminarse tras el vencimiento." hint-size="100%,70px"></dc-import>
        </div>
      </div>

      <div>
        <div style="font-family: 'Outfit'; font-weight: 800; font-size: 15px; letter-spacing: 2px; color: #C9821D; margin-bottom: 14px;">GRUPOS Y MIEMBROS</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <dc-import name="FaqItem" q="¿Puedo estar en varios grupos a la vez?" a="Sí. ENSAMBLA es multi-organización: puedes crear o pertenecer a varios grupos y cambiar entre ellos sin cerrar sesión." hint-size="100%,70px"></dc-import>
          <dc-import name="FaqItem" q="¿Cómo invito a los miembros de mi banda?" a="Desde la gestión de miembros de tu grupo, envía la invitación; cada músico crea su cuenta (correo o Google/Apple) y queda dentro con su perfil e instrumentos." hint-size="100%,70px"></dc-import>
          <dc-import name="FaqItem" q="¿Para qué sirve la disponibilidad?" a="Cada miembro marca cuándo puede tocar o ensayar. Al agendar un evento, ves quién está disponible antes de asignar músicos." hint-size="100%,70px"></dc-import>
        </div>
      </div>

      <div>
        <div style="font-family: 'Outfit'; font-weight: 800; font-size: 15px; letter-spacing: 2px; color: #C9821D; margin-bottom: 14px;">CANCIONES Y EVENTOS</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <dc-import name="FaqItem" q="¿Cómo organizo un evento?" a="Crea el evento en el calendario, asígnale una lista de canciones, define los instrumentos y elige quién toca cada uno. Todos los asignados ven su parte." hint-size="100%,70px"></dc-import>
          <dc-import name="FaqItem" q="¿Puedo guardar acordes y recursos de cada canción?" a="Sí. Cada canción guarda sus acordes y admite recursos: letras, partituras, pistas y archivos disponibles para todo el grupo." hint-size="100%,70px"></dc-import>
          <dc-import name="FaqItem" q="¿Cómo crea la IA una canción o lee un setlist?" a="Escribe el título y la IA (Google Gemini) genera acordes, secciones, tono, BPM y etiquetas — nunca inventa letra. También puede digitalizar un setlist desde una foto." hint-size="100%,70px"></dc-import>
        </div>
      </div>

      <div>
        <div style="font-family: 'Outfit'; font-weight: 800; font-size: 15px; letter-spacing: 2px; color: #C9821D; margin-bottom: 14px;">CUENTA Y SUSCRIPCIÓN</div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <dc-import name="FaqItem" q="¿Cómo cancelo mi suscripción?" a="Desde la configuración de suscripciones de tu App Store o Google Play, al menos 24 horas antes de la renovación." hint-size="100%,70px"></dc-import>
          <dc-import name="FaqItem" q="¿Cómo elimino mi cuenta?" a="Desde tu perfil en la app, o escribiéndonos al correo de soporte." hint-size="100%,70px"></dc-import>
          <dc-import name="FaqItem" q="¿Dónde pido ayuda?" a="Escríbenos por WhatsApp o a hola@ensambla.app. Respondemos lo antes posible." hint-size="100%,70px"></dc-import>
        </div>
      </div>

    </div>

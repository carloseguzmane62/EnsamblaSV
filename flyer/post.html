<!doctype html>
<html lang="es"><head><meta charset="utf-8"><style>
  @font-face { font-family:'Outfit'; font-weight:100 900; font-display:block; src:url('../assets/fonts/outfit-latin.woff2') format('woff2'); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1080px; height:1080px; font-family:'Outfit',sans-serif; color:#FAF9F5; background:#0D0C0B; position:relative; overflow:hidden; -webkit-font-smoothing:antialiased; }
  .orb { position:absolute; border-radius:50%; filter:blur(85px); }
  .orb--a { width:560px; height:560px; top:-210px; right:-160px; background:radial-gradient(circle,rgba(240,161,37,.24),transparent 70%); }
  .orb--b { width:460px; height:460px; bottom:-190px; left:-160px; background:radial-gradient(circle,rgba(201,130,29,.16),transparent 70%); }
  .wrap { position:relative; z-index:1; height:100%; padding:58px 58px 50px; display:flex; flex-direction:column; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .logo { height:44px; }
  .tag { font-size:14px; font-weight:800; letter-spacing:2px; color:#F0A125; background:rgba(240,161,37,.12); border:1px solid rgba(240,161,37,.32); padding:8px 16px; border-radius:999px; }
  .eyebrow { margin-top:34px; display:flex; align-items:center; gap:12px; font-weight:800; font-size:18px; letter-spacing:3px; color:#F0A125; }
  .eyebrow .ic { width:44px; height:44px; border-radius:12px; background:rgba(240,161,37,.12); border:1px solid rgba(240,161,37,.35); display:flex; align-items:center; justify-content:center; }
  h1 { margin-top:16px; font-weight:800; font-size:54px; line-height:1.05; letter-spacing:-.02em; text-wrap:balance; }
  .desc { margin-top:14px; font-size:21px; line-height:1.5; color:#C7C0B2; max-width:940px; }
  .shot { margin-top:26px; flex:1; border-radius:22px; overflow:hidden; border:1px solid #2A251C; box-shadow:0 30px 70px rgba(0,0,0,.5); background:#0D0C0B center/cover no-repeat; }
  .foot { margin-top:24px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .pill { background:linear-gradient(135deg,#F7B23E,#E0890B); color:#14120E; padding:12px 22px; border-radius:999px; font-weight:800; font-size:20px; }
  .who { text-align:right; }
  .who .u { font-weight:800; font-size:24px; color:#F0A125; }
  .who .h { font-size:16px; color:#8A8377; margin-top:2px; }
</style></head>
<body>
  <div class="orb orb--a"></div><div class="orb orb--b"></div>
  <div class="wrap">
    <div class="top"><img class="logo" src="../assets/brand/logo-completo-oscuro.png" alt="ENSAMBLA"><span class="tag">FUNCIÓN DESTACADA</span></div>
    <div class="eyebrow"><span class="ic" id="ic"></span><span id="eyebrow"></span></div>
    <h1 id="title"></h1>
    <div class="desc" id="desc"></div>
    <div class="shot" id="shot"></div>
    <div class="foot">
      <span class="pill">GRATIS 14 días · sin tarjeta</span>
      <div class="who"><div class="u">www.ensambla.app</div><div class="h">@ensamblaapp · WhatsApp +503 7469 1631</div></div>
    </div>
  </div>
<script>
  var IC = {
    map:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F0A125" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 4.4-8 12-8 12s-8-7.6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
    ai:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F0A125" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/></svg>',
    metro:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F0A125" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21h12"/><path d="M9.5 21 12 3.5 14.5 21"/><path d="M12 3.5 17 13"/></svg>',
    note:'<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#F0A125" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>'
  };
  var FEAT = {
    mapa: { ic:'map', eyebrow:'MAPA DE TU IGLESIA', title:'Cada servidor sabe dónde le toca.', desc:'Dibuja el plano de tu templo y asigna a cada quien su área y su día: puertas, parqueo, limpieza, cafetería. Todos lo ven y reciben recordatorio.', img:'../assets/img/mapa-templo.webp', pos:'center' },
    ia: { ic:'ai', eyebrow:'INTELIGENCIA ARTIFICIAL', title:'Crea una canción en segundos.', desc:'Genera la ficha completa —acordes, tono y tempo— desde un título. O digitaliza una lista escrita a mano con solo una foto.', img:'../assets/img/inteligencia-artificial.webp', pos:'center top' },
    vivo: { ic:'metro', eyebrow:'MODO EN VIVO + METRÓNOMO', title:'Nunca más pierdan el tempo.', desc:'Cada canción arranca sola con su tempo, compás y subdivisión correctos — sin salir del escenario.', img:'../assets/img/modo-en-vivo-2.webp', pos:'center' },
    cancionero: { ic:'note', eyebrow:'CANCIONERO + SETLISTS', title:'Todo tu repertorio, siempre listo.', desc:'Letra, acordes y tono ajustable para cada voz. Arma el setlist del domingo en minutos y compártelo con el equipo.', img:'../assets/img/cancionero-acordes.webp', pos:'center top' }
  };
  var key = (location.search.match(/f=(\w+)/) || [])[1] || 'mapa';
  var f = FEAT[key];
  document.getElementById('ic').innerHTML = IC[f.ic];
  document.getElementById('eyebrow').textContent = f.eyebrow;
  document.getElementById('title').textContent = f.title;
  document.getElementById('desc').textContent = f.desc;
  var shot = document.getElementById('shot');
  shot.style.backgroundImage = "url('" + f.img + "')";
  shot.style.backgroundPosition = f.pos;
</script>
</body></html>
